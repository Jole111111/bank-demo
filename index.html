<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SmartLoan Bank · AI Credit Decision</title>
<style>
  :root {
    --ink: #111111;
    --muted: #888888;
    --line: #e8e8e8;
    --bg: #ffffff;
    --ok: #0a7d43;
    --ok-line: #cdeadc;
    --no: #c0392b;
    --no-bg: #fdf4f2;
    --no-line: #f0d2cc;
    --wait: #9a6b00;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Helvetica Neue", "Segoe UI", Arial, sans-serif;
    background: var(--bg); color: var(--ink); line-height: 1.65;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 48px 24px 80px; }
  .brand { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
  h1 { font-size: 26px; font-weight: 600; margin-bottom: 6px; }
  .sub { font-size: 14px; color: var(--muted); margin-bottom: 40px; }

  .field { margin-bottom: 22px; }
  .field label { display: block; font-size: 14px; font-weight: 500; margin-bottom: 6px; }
  .field .note { font-weight: 400; color: var(--muted); font-size: 12.5px; }
  input, select {
    width: 100%; padding: 11px 2px; border: none; border-bottom: 1px solid var(--line);
    font-size: 16px; background: transparent; color: var(--ink); border-radius: 0;
  }
  input:focus, select:focus { outline: none; border-bottom-color: var(--ink); }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
  @media (max-width: 520px) { .row { grid-template-columns: 1fr; } }

  button.cta {
    width: 100%; margin-top: 12px; padding: 15px; border: 1px solid var(--ink);
    background: var(--ink); color: #fff; font-size: 15px; border-radius: 8px;
    cursor: pointer; transition: opacity .15s;
  }
  button.cta:hover { opacity: .85; }
  button.link {
    margin-top: 24px; background: none; border: none; color: var(--muted);
    font-size: 14px; cursor: pointer; text-decoration: underline;
  }
  .hidden { display: none; }

  .decision { padding: 28px 0; border-top: 1px solid var(--line); margin-top: 8px; }
  .decision .state { font-size: 22px; font-weight: 600; }
  .decision.approve .state { color: var(--ok); }
  .decision.reject .state { color: var(--no); }
  .decision.review .state { color: var(--wait); }
  .decision .desc { font-size: 14px; color: var(--muted); margin-top: 4px; }
  .decision .score { font-size: 13px; margin-top: 14px; color: var(--ink); }

  .viewbar { display: flex; gap: 20px; border-bottom: 1px solid var(--line); margin: 32px 0 24px; }
  .viewbar button {
    background: none; border: none; padding: 10px 2px; font-size: 14px;
    color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px;
  }
  .viewbar button.active { color: var(--ink); border-bottom-color: var(--ink); font-weight: 500; }

  .section { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 28px 0 12px; }
  .item { border-left: 3px solid var(--line); padding: 2px 0 2px 14px; margin-bottom: 20px; }
  .item.good { border-left-color: var(--ok); }
  .item.bad  { border-left-color: var(--no); }
  .item h4 { font-size: 15px; font-weight: 600; margin-bottom: 2px; }
  .item.good h4 { color: var(--ok); }
  .item.bad h4 { color: var(--no); }
  .item p { font-size: 13.5px; color: #444; }
  .item .delta { font-size: 12px; color: var(--muted); margin-top: 2px; }

  ul.tips { list-style: none; }
  ul.tips li { font-size: 13.5px; color: #444; padding: 6px 0 6px 18px; position: relative; }
  ul.tips li::before { content: "→"; position: absolute; left: 0; color: var(--muted); }

  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th { text-align: left; font-size: 12px; font-weight: 500; color: var(--muted); padding: 8px 8px 8px 0; border-bottom: 1px solid var(--line); }
  td { padding: 12px 8px 12px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
  td.num { font-variant-numeric: tabular-nums; }
  .pos { color: var(--ok); font-weight: 600; }
  .neg { color: var(--no); font-weight: 600; }
  .meta { font-size: 12.5px; color: var(--muted); margin-top: 24px; }
  .hardline { background: var(--no-bg); border: 1px solid var(--no-line); border-radius: 8px; padding: 12px 14px; font-size: 13px; margin-bottom: 10px; }

  /* ===== Interactive touches ===== */
  .meter { margin-top: 18px; }
  .meter-track { height: 10px; border-radius: 999px; background: var(--soft); position: relative; overflow: visible; }
  .meter-zone { position: absolute; top: 0; bottom: 0; border-radius: 999px; }
  .meter-fill { position: absolute; top: 3px; bottom: 3px; left: 3px; border-radius: 999px; width: 0; transition: width 1.1s cubic-bezier(.22,1,.36,1); }
  .meter-mark { position: absolute; top: -5px; bottom: -5px; width: 1.5px; background: var(--ink); opacity: .35; }
  .meter-label { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-top: 6px; }
  .score-big { display: flex; align-items: baseline; gap: 8px; margin-top: 16px; }
  .score-big .num { font-size: 44px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
  .risk-tag { font-size: 12px; font-weight: 600; padding: 3px 12px; border-radius: 999px; }
  .risk.low  { color: var(--ok); background: #f2faf5; border: 1px solid var(--ok-line); }
  .risk.mid  { color: var(--wait); background: #fdfaf0; border: 1px solid #eee3c2; }
  .risk.high { color: var(--no); background: var(--no-bg); border: 1px solid var(--no-line); }

  .item, .viewbar, .decision > * { opacity: 0; transform: translateY(10px); animation: rise .5s cubic-bezier(.22,1,.36,1) forwards; }
  .decision > *:nth-child(1) { animation-delay: .05s; }
  .decision > *:nth-child(2) { animation-delay: .15s; }
  .decision > *:nth-child(3) { animation-delay: .25s; }
  .viewbar { animation-delay: .3s; }
  .item { animation-delay: calc(var(--i, 0) * .12s + .4s); }
  @keyframes rise { to { opacity: 1; transform: translateY(0); } }

  .item:hover { background: var(--soft); border-radius: 0 8px 8px 0; transition: background .2s; }
  button.cta { transition: transform .12s, opacity .15s; }
  button.cta:active { transform: scale(.98); }
  input, select, .viewbar button { transition: border-color .2s, color .2s; }

  .tips-cta {
    display: inline-block; margin-top: 4px; padding: 8px 16px; border: 1px solid var(--line);
    border-radius: 999px; background: none; font-size: 13px; color: var(--ink); cursor: pointer;
  }
  .tips-cta:hover { border-color: var(--ink); }

  .confetti { position: fixed; top: -12px; width: 9px; height: 14px; border-radius: 2px; z-index: 99; pointer-events: none; animation: fall linear forwards; }
  @keyframes fall { to { transform: translateY(105vh) rotate(720deg); opacity: .6; } }

  .thinking { text-align: center; padding: 60px 0; }
  .thinking .dots span { display: inline-block; width: 8px; height: 8px; margin: 0 4px; border-radius: 50%; background: var(--ink); opacity: .25; animation: pulse 1s infinite; }
  .thinking .dots span:nth-child(2) { animation-delay: .18s; }
  .thinking .dots span:nth-child(3) { animation-delay: .36s; }
  @keyframes pulse { 0%,100% { opacity:.2; transform: scale(.8);} 50% { opacity:1; transform: scale(1.15);} }
  .thinking p { font-size: 13px; color: var(--muted); margin-top: 14px; }

  .random-link { background: none; border: none; color: var(--muted); font-size: 13.5px; cursor: pointer; text-decoration: underline; padding: 0; margin-top: 16px; }
  .random-link:hover { color: var(--ink); }
</style>
</head>
<body>
<div class="wrap">

  <div id="page-form">
    <div class="brand">SmartLoan Bank</div>
    <h1>Loan Application</h1>
    <p class="sub">Fill in your details. Our AI will return a decision in seconds — with a clear explanation of every reason.</p>

    <div class="row">
      <div class="field"><label>Full Name</label><input id="f-name" type="text" value="David Zhang"></div>
      <div class="field"><label>Monthly Income (¥)</label><input id="f-income" type="number" value="18000"></div>
    </div>
    <div class="row">
      <div class="field"><label>Loan Amount (¥)</label><input id="f-amount" type="number" value="300000"></div>
      <div class="field"><label>Term</label>
        <select id="f-term">
          <option value="12">12 months</option>
          <option value="24">24 months</option>
          <option value="36" selected>36 months</option>
          <option value="60">60 months</option>
        </select>
      </div>
    </div>
    <div class="row">
      <div class="field"><label>Credit Score <span class="note">350–950</span></label><input id="f-credit" type="number" value="720"></div>
      <div class="field"><label>Existing Monthly Debt (¥)</label><input id="f-debt" type="number" value="3500"></div>
    </div>
    <div class="row">
      <div class="field"><label>Current Job Tenure</label>
        <select id="f-job">
          <option value="0">Unemployed / Self-employed</option>
          <option value="1">Under 1 year</option>
          <option value="3" selected>1–3 years</option>
          <option value="5">3–5 years</option>
          <option value="8">Over 5 years</option>
        </select>
      </div>
      <div class="field"><label>Late Payments (last 2 years)</label><input id="f-overdue" type="number" value="0"></div>
    </div>
    <div class="field"><label>Owns Local Property</label>
      <select id="f-house"><option value="1" selected>Yes</option><option value="0">No</option></select>
    </div>

    <button class="cta" onclick="runDecision()">Run AI Assessment</button>
    <button class="random-link" onclick="fillRandom()">🎲 Surprise me — load a random applicant</button>
  </div>

  <div id="page-thinking" class="hidden">
    <div class="brand">SmartLoan Bank</div>
    <div class="thinking">
      <div class="dots"><span></span><span></span><span></span></div>
      <p id="thinking-msg">AI is reviewing the application…</p>
    </div>
  </div>

  <div id="page-result" class="hidden">
    <div class="brand">SmartLoan Bank · Decision Result</div>

    <div class="decision" id="decisionBox"></div>

    <div class="viewbar">
      <button id="tab-user" class="active" onclick="switchTab('user')">Applicant View</button>
      <button id="tab-boss" onclick="switchTab('boss')">Management View</button>
    </div>

    <div id="panel-user"></div>
    <div id="panel-boss" class="hidden"></div>

    <button class="link" onclick="resetAll()">← Back · assess another application</button>
  </div>

</div>

<script>
// ============ Explainable AI decision engine ============
const RULES = [
  { id: "R1", name: "Credit Score", evaluate: (a) => {
      const c = a.creditScore;
      if (c >= 750) return { impact: 30, status: "good", short: "Excellent credit score",
        detail: `Credit score of ${c} is above the 750 excellence threshold — credit history is highly reliable.` };
      if (c >= 680) return { impact: 22, status: "good", short: "Good credit score",
        detail: `Credit score of ${c} falls in the good range (680–749); overall credit health is solid.` };
      if (c >= 600) return { impact: 8, status: "neutral", short: "Average credit score",
        detail: `Credit score of ${c} falls in the average range (600–679); acceptable but lowers the overall score.` };
      if (c >= 550) return { impact: -15, status: "bad", short: "Low credit score",
        detail: `Credit score of ${c} is below 600 — elevated risk.` };
      return { impact: -30, status: "bad", short: "Poor credit score", hard: true,
        detail: `Credit score of only ${c} is below the 550 hard cutoff. Policy requires rejection.` };
  }},
  { id: "R2", name: "Debt-to-Income Ratio", evaluate: (a) => {
      const dti = (a.monthlyDebt + a.estimateMonthly) / a.monthlyIncome;
      const pct = (dti * 100).toFixed(1);
      if (dti <= 0.35) return { impact: 25, status: "good", short: "Healthy debt level",
        detail: `Including this loan's monthly payment, total DTI is ${pct}% — well below the 35% safety line.` };
      if (dti <= 0.50) return { impact: 12, status: "good", short: "Acceptable debt level",
        detail: `Including this loan's monthly payment, total DTI is ${pct}% — within the acceptable 35%–50% range.` };
      if (dti <= 0.60) return { impact: -8, status: "bad", short: "Debt level too high",
        detail: `Including this loan's monthly payment, total DTI is ${pct}% — above the 50% warning line.` };
      return { impact: -25, status: "bad", short: "Debt severely over limit", hard: true,
        detail: `Including this loan's monthly payment, total DTI is ${pct}% — above the 60% hard cutoff. Rejection required.` };
  }},
  { id: "R3", name: "Payment Delinquency", evaluate: (a) => {
      const o = a.overdue;
      if (o === 0) return { impact: 20, status: "good", short: "No late payments",
        detail: "No late payments in the past 2 years — repayment willingness and history are excellent." };
      if (o <= 2) return { impact: 5, status: "neutral", short: "Minor late payments",
        detail: `${o} late payment(s) in the past 2 years — a minor blemish, counted in the score but below the rejection line.` };
      if (o <= 5) return { impact: -18, status: "bad", short: "Multiple late payments",
        detail: `${o} late payments in the past 2 years — risk has risen significantly.` };
      return { impact: -20, status: "bad", short: "Severe delinquency", hard: true,
        detail: `${o} late payments in the past 2 years — above the 5-payment hard cutoff. Rejection required.` };
  }},
  { id: "R4", name: "Employment Stability", evaluate: (a) => {
      const j = a.jobYears;
      if (j >= 5) return { impact: 15, status: "good", short: "Very stable employment",
        detail: "Employed at current job for over 5 years — income source is stable and dependable." };
      if (j >= 3) return { impact: 10, status: "good", short: "Stable employment",
        detail: "Employed at current job for 3–5 years — income stability is good." };
      if (j >= 1) return { impact: 3, status: "neutral", short: "Short job tenure",
        detail: "Employed at current job for 1–3 years — reasonably stable but with a short track record." };
      return { impact: -12, status: "bad", short: "Unstable income source",
        detail: "Unemployed or self-employed with no stable income proof — a significant negative factor." };
  }},
  { id: "R5", name: "Collateral Security", evaluate: (a) => {
      if (a.hasHouse) return { impact: 10, status: "good", short: "Owns local property",
        detail: "Applicant owns local real estate — recoverable assets in case of default, materially lowering risk." };
      return { impact: 0, status: "neutral", short: "No property",
        detail: "No local property owned — this is an unsecured loan with higher exposure (no points added or deducted)." };
  }},
];
const PASS = 65, REVIEW = 50;

// ---- Random applicant profiles for playful exploration ----
const RANDOM_POOL = [
  { name: "Emily Chen",  credit: 810, income: 32000, amount: 500000, debt: 4000, job: 8, overdue: 0, house: 1 },
  { name: "Marcus Lee",  credit: 590, income: 12000, amount: 400000, debt: 5000, job: 1, overdue: 6, house: 0 },
  { name: "Sofia Wong",  credit: 705, income: 15000, amount: 200000, debt: 2500, job: 3, overdue: 1, house: 0 },
  { name: "James Park",  credit: 660, income: 22000, amount: 600000, debt: 8000, job: 5, overdue: 2, house: 1 },
  { name: "Ava Liu",     credit: 780, income: 26000, amount: 350000, debt: 3000, job: 8, overdue: 0, house: 1 },
  { name: "Noah Kim",    credit: 540, income: 9000,  amount: 250000, debt: 3000, job: 0, overdue: 3, house: 0 },
  { name: "Mia Tan",     credit: 730, income: 11000, amount: 180000, debt: 1000, job: 3, overdue: 0, house: 0 },
];
function fillRandom() {
  const p = RANDOM_POOL[Math.floor(Math.random() * RANDOM_POOL.length)];
  document.getElementById("f-name").value = p.name;
  document.getElementById("f-income").value = p.income;
  document.getElementById("f-amount").value = p.amount;
  document.getElementById("f-credit").value = p.credit;
  document.getElementById("f-debt").value = p.debt;
  document.getElementById("f-job").value = String(p.job);
  document.getElementById("f-overdue").value = p.overdue;
  document.getElementById("f-house").value = String(p.house);
  runDecision();
}

const THINK_STEPS = [
  "Pulling credit history…",
  "Calculating debt-to-income ratio…",
  "Checking repayment behavior…",
  "Weighing stability factors…",
  "Finalizing decision…",
];

function runDecision() {
  const income = +document.getElementById("f-income").value || 0;
  const amount = +document.getElementById("f-amount").value || 0;
  const term = +document.getElementById("f-term").value;
  const a = {
    name: document.getElementById("f-name").value || "Applicant",
    monthlyIncome: income, amount, term,
    creditScore: +document.getElementById("f-credit").value || 0,
    monthlyDebt: +document.getElementById("f-debt").value || 0,
    jobYears: +document.getElementById("f-job").value,
    overdue: +document.getElementById("f-overdue").value || 0,
    hasHouse: document.getElementById("f-house").value === "1",
  };
  const r = 0.0435 / 12;
  a.estimateMonthly = amount * r * Math.pow(1 + r, term) / (Math.pow(1 + r, term) - 1);

  // Show the "AI thinking" phase first — more engaging than an instant result
  document.getElementById("page-form").classList.add("hidden");
  document.getElementById("page-result").classList.add("hidden");
  const think = document.getElementById("page-thinking");
  think.classList.remove("hidden");
  const msg = document.getElementById("thinking-msg");
  let step = 0;
  msg.textContent = THINK_STEPS[0];
  const timer = setInterval(() => {
    step++;
    if (step < THINK_STEPS.length) msg.textContent = THINK_STEPS[step];
  }, 320);

  setTimeout(() => {
    clearInterval(timer);
    think.classList.add("hidden");

    const results = RULES.map(rule => ({ rule, ...rule.evaluate(a) }));
    const score = results.reduce((s, x) => s + x.impact, 0);
    const hard = results.filter(x => x.hard);
    const decision = hard.length ? "reject" : score >= PASS ? "approve" : score >= REVIEW ? "review" : "reject";

    render(a, results, score, decision, hard);
    document.getElementById("page-result").classList.remove("hidden");
    window.scrollTo(0, 0);
    if (decision === "approve") confetti();
  }, THINK_STEPS.length * 320 + 400);
}

function render(a, results, score, decision, hard) {
  const box = document.getElementById("decisionBox");
  const cls = { approve: "approve", reject: "reject", review: "review" }[decision];
  const title = { approve: "Loan Approved", reject: "Application Declined", review: "Referred for Manual Review" }[decision];
  const desc = {
    approve: `Congratulations, ${a.name}! Your loan of ¥${a.amount.toLocaleString()} over ${a.term} months has been approved.`,
    review: `${a.name}, your application score sits in the middle band and has been referred to a loan officer for manual review. Expect feedback within 1–2 business days.`,
    reject: `We're sorry, ${a.name} — your application was not approved this time. The key reasons are highlighted in red below.`,
  }[decision];
  box.className = "decision " + cls;
  const riskClass = decision === "approve" ? "low" : decision === "review" ? "mid" : "high";
  const riskLabel = decision === "approve" ? "Low risk" : decision === "review" ? "Medium risk" : "High risk";
  box.innerHTML = `<div class="state">${title}</div>
    <div class="desc">${desc}</div>
    <div class="score-big">
      <span class="num" id="scoreNum">0</span>
      <span class="risk-tag ${riskClass}">${riskLabel}</span>
    </div>
    <div class="meter">
      <div class="meter-track">
        <div class="meter-zone" style="left:0;width:50%;background:var(--no-line)"></div>
        <div class="meter-zone" style="left:50%;width:15%;background:#eee3c2"></div>
        <div class="meter-zone" style="left:65%;width:35%;background:var(--ok-line)"></div>
        <div class="meter-mark" style="left:65%"></div>
        <div class="meter-mark" style="left:50%"></div>
        <div class="meter-fill" id="meterFill" style="background:${decision === "approve" ? "var(--ok)" : decision === "review" ? "#c9a227" : "var(--no)"}"></div>
      </div>
      <div class="meter-label"><span>0</span><span>Review ${REVIEW}</span><span>Pass ${PASS}</span><span>100</span></div>
    </div>`;

  // Animate the score counter and meter after paint
  requestAnimationFrame(() => {
    document.getElementById("meterFill").style.width = `calc(${Math.max(0, Math.min(100, score))}% - 6px)`;
    animateCount(document.getElementById("scoreNum"), score, 900);
  });

  // ===== Applicant view =====
  const neg = results.filter(x => x.impact < 0);
  const pos = results.filter(x => x.impact > 0);
  const shows = decision === "approve" ? pos : neg.length ? neg : [results[0]];
  let userHtml = decision === "reject"
    ? `<div class="section">Reasons for decline — red items are key</div>`
    : `<div class="section">Reasons for approval — green items are key</div>`;
  userHtml += shows.map((x, i) => `
    <div class="item ${x.status}" style="--i:${i}">
      <h4>${x.short}</h4>
      <p>${x.detail}</p>
      <div class="delta">Impact on decision: ${x.impact > 0 ? "+" : ""}${x.impact} pts</div>
    </div>`).join("");

  if (decision !== "approve") {
    const tips = [];
    if (a.creditScore < 680) tips.push("Pay on time and lower credit-card utilization to lift your score above 680");
    const dti = (a.monthlyDebt + a.estimateMonthly) / a.monthlyIncome;
    if (dti > 0.5) tips.push("Request a smaller amount or a longer term to reduce the monthly payment, or pay down existing debt first");
    if (a.overdue > 0) tips.push("Avoid any late payments for the next 2 years — their impact fades over time");
    if (a.jobYears < 1) tips.push("Reapply after 1 year of stable employment for a noticeably better score");
    if (tips.length) {
      userHtml += `<div class="section">How to improve</div>
        <ul class="tips" id="tipsList" style="display:none">` +
        tips.map(t => `<li>${t}</li>`).join("") + `</ul>
        <button class="tips-cta" onclick="toggleTips(this)">💡 Show me how to improve</button>`;
    }
  }
  document.getElementById("panel-user").innerHTML = userHtml;

  // ===== Management view =====
  let bossHtml = `<div class="section">Score Factor Breakdown</div><table>
    <thead><tr><th>Factor</th><th>Direction</th><th>Contribution</th></tr></thead><tbody>` +
    results.map(x => `
      <tr>
        <td><b>${x.rule.id} ${x.rule.name}</b><br><span style="color:var(--muted);font-size:12px">${x.short}</span></td>
        <td>${x.status === "good" ? '<span class="pos">Positive</span>' : x.status === "bad" ? '<span class="neg">Negative</span>' : "Neutral"}</td>
        <td class="num ${x.impact >= 0 ? "pos" : "neg"}">${x.impact > 0 ? "+" : ""}${x.impact}</td>
      </tr>`).join("") + `</tbody></table>`;

  if (hard.length) {
    bossHtml += `<div class="section">Triggered Hard-Rejection Rules</div>` +
      hard.map(x => `<div class="hardline"><b>${x.rule.id} ${x.rule.name}</b>: ${x.detail}</div>`).join("");
  }
  bossHtml += `<div class="meta">
    Decision logic: any factor hitting a hard cutoff → immediate rejection; otherwise score ≥ ${PASS} approves, ${REVIEW}–${PASS} goes to manual review, &lt; ${REVIEW} rejects.<br>
    Monthly payment estimated at 4.35% APR, equal installments: about ¥${a.estimateMonthly.toFixed(0)}/month.<br>
    Every factor and score is auditable and traceable — meeting explainability requirements for AI in credit decisions.</div>`;
  document.getElementById("panel-boss").innerHTML = bossHtml;

  switchTab("user");
}

function switchTab(t) {
  document.getElementById("tab-user").classList.toggle("active", t === "user");
  document.getElementById("tab-boss").classList.toggle("active", t === "boss");
  document.getElementById("panel-user").classList.toggle("hidden", t !== "user");
  document.getElementById("panel-boss").classList.toggle("hidden", t !== "boss");
}

function resetAll() {
  document.getElementById("page-result").classList.add("hidden");
  document.getElementById("page-thinking").classList.add("hidden");
  document.getElementById("page-form").classList.remove("hidden");
  window.scrollTo(0, 0);
}

// ===== Fun extras =====
function animateCount(el, target, duration) {
  const start = performance.now();
  function tick(now) {
    const t = Math.min(1, (now - start) / duration);
    const eased = 1 - Math.pow(1 - t, 3);
    el.textContent = Math.round(target * eased);
    if (t < 1) requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

function toggleTips(btn) {
  const list = document.getElementById("tipsList");
  const open = list.style.display !== "none";
  list.style.display = open ? "none" : "";
  btn.textContent = open ? "💡 Show me how to improve" : "↑ Hide suggestions";
}

function confetti() {
  const colors = ["#0a7d43", "#f5c518", "#1a56db", "#e67e22", "#9b59b6"];
  for (let i = 0; i < 60; i++) {
    const c = document.createElement("div");
    c.className = "confetti";
    c.style.left = Math.random() * 100 + "vw";
    c.style.background = colors[i % colors.length];
    c.style.animationDuration = (1.6 + Math.random() * 1.4) + "s";
    c.style.animationDelay = Math.random() * .5 + "s";
    c.style.opacity = .9;
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 3500);
  }
}
