<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SmartLoan Bank · AI Credit Decision</title>
<style>
  :root {
    --ink: #191c2b;
    --muted: #8a8fa3;
    --line: #eceef4;
    --bg: #f6f7fb;
    --card: #ffffff;
    --accent: #4f46e5;
    --accent2: #a855f7;
    --grad: linear-gradient(120deg, #4f46e5, #a855f7);
    --ok: #0a9d58;
    --ok-soft: #e6f7ef;
    --no: #e5484d;
    --no-soft: #fdebec;
    --wait: #d9930d;
    --wait-soft: #fdf6e3;
    --shadow: 0 8px 30px rgba(25, 28, 43, .08);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "SF Pro Text", "Segoe UI", "Helvetica Neue", sans-serif;
    background: var(--bg); color: var(--ink); line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 28px 20px 80px; }

  .brand { font-size: 13px; font-weight: 700; letter-spacing: -.01em; margin-bottom: 20px; display: flex; align-items: center; gap: 8px; }
  .brand .logo { width: 26px; height: 26px; border-radius: 8px; background: var(--grad); display: inline-flex; align-items: center; justify-content: center; color: #fff; font-size: 13px; }

  .card {
    background: var(--card); border-radius: 24px; padding: 28px 24px;
    box-shadow: var(--shadow); margin-bottom: 20px;
  }

  h1 { font-size: 26px; font-weight: 800; letter-spacing: -.03em; margin-bottom: 6px; }
  .sub { font-size: 14px; color: var(--muted); margin-bottom: 28px; }

  .field { margin-bottom: 22px; }
  .field label { display: flex; justify-content: space-between; align-items: baseline; font-size: 13.5px; font-weight: 600; margin-bottom: 10px; }
  .field label .val { color: var(--accent); font-weight: 800; font-size: 16px; letter-spacing: -.02em; }
  input[type=text], input[type=number], select {
    width: 100%; padding: 13px 16px; border: 1.5px solid var(--line);
    border-radius: 14px; font-size: 15px; background: #fafafd; color: var(--ink);
    transition: border-color .2s, box-shadow .2s; appearance: none;
  }
  input:focus, select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 4px rgba(79,70,229,.1); }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 480px) { .row { grid-template-columns: 1fr; } }

  /* Revolut-style sliders */
  .slider-wrap { padding: 4px 2px; }
  input[type=range] {
    width: 100%; appearance: none; height: 6px; border-radius: 999px; outline: none;
    background: linear-gradient(to right, var(--accent) var(--fill, 50%), #e8eaf3 var(--fill, 50%));
    cursor: pointer;
  }
  input[type=range]::-webkit-slider-thumb {
    appearance: none; width: 26px; height: 26px; border-radius: 50%;
    background: #fff; border: 2.5px solid var(--accent);
    box-shadow: 0 3px 10px rgba(79,70,229,.35); transition: transform .15s;
  }
  input[type=range]::-webkit-slider-thumb:active { transform: scale(1.2); }
  .live-pill {
    display: inline-flex; align-items: center; gap: 6px; margin-top: 10px;
    background: #f0efff; color: var(--accent); font-size: 13px; font-weight: 700;
    padding: 7px 14px; border-radius: 999px;
  }

  .cta {
    width: 100%; margin-top: 8px; padding: 16px; border: none; border-radius: 16px;
    background: var(--grad); background-size: 150% 150%; color: #fff; font-size: 16px;
    font-weight: 700; cursor: pointer; transition: transform .15s, box-shadow .2s, background-position .4s;
    box-shadow: 0 8px 24px rgba(79,70,229,.35);
  }
  .cta:hover { transform: translateY(-2px); box-shadow: 0 12px 28px rgba(79,70,229,.4); background-position: 100% 0; }
  .cta:active { transform: scale(.98); }
  .link-btn {
    margin-top: 20px; background: none; border: none; color: var(--muted);
    font-size: 14px; cursor: pointer; text-decoration: underline;
  }
  .hidden { display: none; }

  /* Verdict hero */
  .verdict-hero {
    border-radius: 24px; padding: 30px 24px; margin-bottom: 20px; color: #fff;
    background: var(--grad); box-shadow: 0 14px 36px rgba(79,70,229,.35);
    position: relative; overflow: hidden;
  }
  .verdict-hero.approve { background: linear-gradient(120deg, #0a9d58, #34c98e); box-shadow: 0 14px 36px rgba(10,157,88,.35); }
  .verdict-hero.reject  { background: linear-gradient(120deg, #b3323f, #e5484d); box-shadow: 0 14px 36px rgba(229,72,77,.3); }
  .verdict-hero.review  { background: linear-gradient(120deg, #c07f0a, #e8a93d); box-shadow: 0 14px 36px rgba(217,147,13,.3); }
  .verdict-hero .emoji { font-size: 40px; }
  .verdict-hero h2 { font-size: 24px; font-weight: 800; letter-spacing: -.03em; margin: 8px 0 8px; }
  .verdict-hero p { font-size: 14px; opacity: .95; white-space: pre-line; }

  .viewbar {
    display: flex; background: #e9ebf3; border-radius: 14px; padding: 4px; margin-bottom: 22px;
  }
  .viewbar button {
    flex: 1; border: none; background: transparent; padding: 11px; font-size: 14px; font-weight: 600;
    color: var(--muted); border-radius: 11px; cursor: pointer; transition: all .25s cubic-bezier(.34,1.56,.64,1);
  }
  .viewbar button.active { background: #fff; color: var(--ink); box-shadow: 0 2px 8px rgba(25,28,43,.12); }

  .section { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 700; margin: 26px 0 14px; }
  .reason-card {
    background: #fff; border-radius: 18px; padding: 18px 18px; margin-bottom: 12px;
    box-shadow: var(--shadow); border-left: 5px solid transparent;
    transition: transform .2s cubic-bezier(.34,1.56,.64,1);
  }
  .reason-card:hover { transform: translateY(-3px) scale(1.01); }
  .reason-card.good { border-left-color: var(--ok); }
  .reason-card.bad  { border-left-color: var(--no); }
  .reason-card.neutral { border-left-color: var(--line); }
  .reason-card .icon { font-size: 22px; margin-bottom: 6px; }
  .reason-card h4 { font-size: 15px; font-weight: 700; letter-spacing: -.01em; margin-bottom: 3px; }
  .reason-card.good h4 { color: var(--ok); }
  .reason-card.bad h4 { color: #b3323f; }
  .reason-card p { font-size: 13.5px; color: #4b5060; }

  ul.tips { list-style: none; }
  ul.tips li { font-size: 13.5px; color: #4b5060; padding: 7px 0 7px 20px; position: relative; }
  ul.tips li::before { content: "→"; position: absolute; left: 0; color: var(--accent); font-weight: 700; }

  .warm-note {
    background: #f0efff; border-radius: 18px; padding: 16px 18px; font-size: 13.5px;
    color: #3d3f66; margin: 20px 0; line-height: 1.65;
  }

  /* Score ring — management */
  .ring-row { display: flex; align-items: center; gap: 20px; margin: 8px 0 20px; }
  .ring { position: relative; width: 120px; height: 120px; flex-shrink: 0; }
  .ring svg { transform: rotate(-90deg); }
  .ring .track { stroke: #e8eaf3; }
  .ring .bar { stroke: url(#ringGrad); stroke-linecap: round; transition: stroke-dashoffset 1.2s cubic-bezier(.22,1,.36,1); }
  .ring .center {
    position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .ring .center .num { font-size: 30px; font-weight: 800; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
  .ring .center .lbl { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
  .risk-tag { font-size: 12.5px; font-weight: 700; padding: 5px 14px; border-radius: 999px; }
  .risk.low  { color: var(--ok); background: var(--ok-soft); }
  .risk.mid  { color: var(--wait); background: var(--wait-soft); }
  .risk.high { color: var(--no); background: var(--no-soft); }

  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th { text-align: left; font-size: 11.5px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; padding: 8px 8px 8px 0; border-bottom: 1px solid var(--line); }
  td { padding: 12px 8px 12px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
  td.num { font-variant-numeric: tabular-nums; font-weight: 700; }
  .pos { color: var(--ok); }
  .neg { color: var(--no); }
  .meta { font-size: 12px; color: var(--muted); margin-top: 20px; white-space: pre-line; line-height: 1.7; }

  /* Animations */
  .reason-card, .viewbar, .verdict-hero > *, .ring-row { opacity: 0; transform: translateY(14px) scale(.98); animation: pop .55s cubic-bezier(.34,1.4,.64,1) forwards; }
  .verdict-hero > *:nth-child(1) { animation-delay: .05s; }
  .verdict-hero > *:nth-child(2) { animation-delay: .12s; }
  .verdict-hero > *:nth-child(3) { animation-delay: .2s; }
  .viewbar { animation-delay: .25s; }
  .reason-card { animation-delay: calc(var(--i, 0) * .1s + .35s); }
  @keyframes pop { to { opacity: 1; transform: translateY(0) scale(1); } }

  .tips-cta {
    display: inline-block; padding: 10px 18px; border: 1.5px solid var(--accent);
    border-radius: 999px; background: #fff; font-size: 13.5px; font-weight: 600;
    color: var(--accent); cursor: pointer; transition: all .2s;
  }
  .tips-cta:hover { background: var(--accent); color: #fff; transform: translateY(-1px); }

  .confetti { position: fixed; top: -14px; width: 10px; height: 15px; border-radius: 3px; z-index: 99; pointer-events: none; animation: fall linear forwards; }
  @keyframes fall { to { transform: translateY(108vh) rotate(720deg); opacity: .5; } }

  .thinking { text-align: center; padding: 90px 0; }
  .orb {
    width: 74px; height: 74px; margin: 0 auto 22px; border-radius: 24px;
    background: var(--grad); animation: orbFloat 1.6s ease-in-out infinite;
    box-shadow: 0 12px 32px rgba(79,70,229,.4);
  }
  @keyframes orbFloat { 0%,100% { transform: translateY(0) rotate(-6deg); border-radius: 24px; } 50% { transform: translateY(-14px) rotate(6deg); border-radius: 34px; } }
  .thinking p { font-size: 14px; color: var(--muted); font-weight: 600; }

  .random-link { background: none; border: none; color: var(--muted); font-size: 14px; cursor: pointer; text-decoration: underline; padding: 0; margin-top: 14px; }
  .random-link:hover { color: var(--accent); }

  .page-anim { animation: pageIn .45s cubic-bezier(.22,1,.36,1); }
  @keyframes pageIn { from { opacity: 0; transform: translateY(18px); } }
</style>
</head>
<body>
<div class="wrap">

  <div id="page-form" class="page-anim">
    <div class="brand"><span class="logo">S</span> SmartLoan Bank</div>

    <div class="card">
      <h1>Loan Application</h1>
      <p class="sub">Tell us a little about yourself. A person — assisted by AI, never replaced by it — will review your application and explain every decision in plain words.</p>

      <div class="field"><label>Full Name</label><input id="f-name" type="text" value="David Zhang"></div>

      <div class="field slider-wrap">
        <label>Loan Amount <span class="val" id="amountVal">¥300,000</span></label>
        <input id="f-amount" type="range" min="50000" max="1000000" step="10000" value="300000" oninput="syncSliders()">
        <div><span class="live-pill" id="monthlyPill">≈ ¥8,931 / month</span></div>
      </div>

      <div class="field slider-wrap">
        <label>Term <span class="val" id="termVal">36 months</span></label>
        <input id="f-term" type="range" min="0" max="3" step="1" value="2" oninput="syncSliders()">
      </div>

      <div class="row">
        <div class="field"><label>Monthly Income (¥)</label><input id="f-income" type="number" value="18000"></div>
        <div class="field"><label>Existing Monthly Debt (¥)</label><input id="f-debt" type="number" value="3500"></div>
      </div>
      <div class="row">
        <div class="field"><label>Credit Score <span class="note" style="font-weight:400;color:var(--muted)">350–950</span></label><input id="f-credit" type="number" value="720"></div>
        <div class="field"><label>Late Payments (2 yrs)</label><input id="f-overdue" type="number" value="0"></div>
      </div>
      <div class="row">
        <div class="field"><label>Current Job Tenure</label>
          <select id="f-job">
            <option value="0">Unemployed / Self-employed</option>
            <option value="1">Under 1 year</option>
            <option value="3" selected>1–3 years</option>
            <option value="5">3–5 years</option>
            <option value="8">Over 5 years</option>
          </select>
        </div>
        <div class="field"><label>Owns Local Property</label>
          <select id="f-house"><option value="1" selected>Yes</option><option value="0">No</option></select>
        </div>
      </div>

      <button class="cta" onclick="runDecision()">Review My Application ✨</button>
      <div style="text-align:center"><button class="random-link" onclick="fillRandom()">🎲 Surprise me — load a random applicant</button></div>
    </div>
  </div>

  <div id="page-thinking" class="hidden">
    <div class="brand"><span class="logo">S</span> SmartLoan Bank</div>
    <div class="thinking">
      <div class="orb"></div>
      <p id="thinking-msg">Reading through your application…</p>
    </div>
  </div>

  <div id="page-result" class="hidden">
    <div class="brand"><span class="logo">S</span> SmartLoan Bank</div>

    <div class="verdict-hero" id="verdictHero"></div>

    <div class="viewbar">
      <button id="tab-user" class="active" onclick="switchTab('user')">For You</button>
      <button id="tab-boss" onclick="switchTab('boss')">For Management</button>
    </div>

    <div id="panel-user"></div>
    <div id="panel-boss" class="hidden"></div>

    <div style="text-align:center"><button class="link-btn" onclick="resetAll()">← Back · review another application</button></div>
  </div>

</div>

<script>
// ============ Explainable AI decision engine ============
// Copy principles: describe circumstances, not character. No blame, no jargon,
// no point values shown to applicants. Quantification lives only in Management View.
const RULES = [
  { id: "R1", name: "Credit History", evaluate: (a) => {
      const c = a.creditScore;
      if (c >= 750) return { impact: 30, status: "good", icon: "🌟", short: "A strong, well-established credit history",
        detail: `Your credit score of ${c} shows years of reliable borrowing and repayment. Lenders see this and feel confident.` };
      if (c >= 680) return { impact: 22, status: "good", icon: "✅", short: "A healthy credit history",
        detail: `Your credit score of ${c} reflects consistent, responsible credit use — a real strength in this application.` };
      if (c >= 600) return { impact: 8, status: "neutral", icon: "🌱", short: "A credit history still taking shape",
        detail: `Your score of ${c} sits in the middle range. That's not a problem in itself — it simply gives us less to go on.` };
      if (c >= 550) return { impact: -15, status: "bad", icon: "🪨", short: "A credit history with some bumps",
        detail: `Your score of ${c} suggests the past few years haven't always been easy financially. We know that happens to good people — it just means we need to be more careful this time.` };
      return { impact: -30, status: "bad", icon: "🧭", short: "A credit history that needs rebuilding first", hard: true,
        detail: `Your current score of ${c} is below what our policy allows us to lend against. It isn't a verdict on you — it's a sign that rebuilding first would put you in a far better position.` };
  }},
  { id: "R2", name: "Affordability", evaluate: (a) => {
      const dti = (a.monthlyDebt + a.estimateMonthly) / a.monthlyIncome;
      const pct = (dti * 100).toFixed(1);
      if (dti <= 0.35) return { impact: 25, status: "good", icon: "🫁", short: "Room to breathe each month",
        detail: `Even with this loan's monthly payment added, about ${(100 - pct).toFixed(1)}% of your income stays free. This loan fits comfortably in your life.` };
      if (dti <= 0.50) return { impact: 12, status: "good", icon: "👌", short: "A manageable monthly commitment",
        detail: `With this loan added, your monthly commitments stay within what your income can comfortably handle.` };
      if (dti <= 0.60) return { impact: -8, status: "bad", icon: "😮‍💨", short: "It would feel tight",
        detail: `Adding this payment would leave very little breathing room each month. We'd worry this loan could become a source of stress rather than help.` };
      return { impact: -25, status: "bad", icon: "🛟", short: "It would stretch you too far", hard: true,
        detail: `This payment would take more of your monthly income than we could responsibly allow. We'd be setting you up for a hard time — and we'd rather help you find an amount that truly works.` };
  }},
  { id: "R3", name: "Repayment Record", evaluate: (a) => {
      const o = a.overdue;
      if (o === 0) return { impact: 20, status: "good", icon: "🏅", short: "Every payment made on time",
        detail: "Not a single late payment in two years. It tells us you treat your commitments seriously — that matters to us." };
      if (o <= 2) return { impact: 5, status: "neutral", icon: "🌤️", short: "A couple of slips along the way",
        detail: `Life gets busy, and ${o} late payment(s) happen to the best of us. This alone wouldn't hold your application back.` };
      if (o <= 5) return { impact: -18, status: "bad", icon: "🌧️", short: "Some recent difficulty keeping up",
        detail: `We can see the past two years haven't been easy — ${o} late payments. We don't judge the reasons; we just need the picture to steady a little first.` };
      return { impact: -20, status: "bad", icon: "⛵", short: "A tough couple of years", hard: true,
        detail: `With ${o} late payments recently, now wouldn't be the right moment for a new commitment. When things stabilise, we'd genuinely welcome your application again.` };
  }},
  { id: "R4", name: "Income Stability", evaluate: (a) => {
      const j = a.jobYears;
      if (j >= 5) return { impact: 15, status: "good", icon: "🏔️", short: "An income you can count on",
        detail: "Five or more years in your current work speaks for itself — a steady foundation to build on." };
      if (j >= 3) return { impact: 10, status: "good", icon: "🧱", short: "Settled and steady",
        detail: "A few years in your current role gives us good confidence in your income going forward." };
      if (j >= 1) return { impact: 3, status: "neutral", icon: "🌱", short: "Still settling in",
        detail: "You're still early in your current role. Nothing wrong with that — we'd just love to see a longer track record." };
      return { impact: -12, status: "bad", icon: "🌊", short: "Income that's harder to predict",
        detail: "Without a steady employer, income can swing month to month. We understand that's often not a choice — it just makes this particular loan harder to size safely." };
  }},
  { id: "R5", name: "Security", evaluate: (a) => {
      if (a.hasHouse) return { impact: 10, status: "good", icon: "🏡", short: "Owning a home adds security",
        detail: "Property ownership gives this loan a safety net, which lets us be more flexible." };
      return { impact: 0, status: "neutral", icon: "🔑", short: "Renting is perfectly fine",
        detail: "No property owned — and that's completely okay. Most of our customers rent. It neither helps nor hurts here." };
  }},
];
const PASS = 65, REVIEW = 50;
const TERMS = [12, 24, 36, 60];
const APR = 0.0435;

function monthlyPayment(amount, months) {
  const r = APR / 12;
  return amount * r * Math.pow(1 + r, months) / (Math.pow(1 + r, months) - 1);
}

// ---- Revolut-style live sliders ----
function syncSliders() {
  const amount = +document.getElementById("f-amount").value;
  const term = TERMS[+document.getElementById("f-term").value];
  document.getElementById("amountVal").textContent = "¥" + amount.toLocaleString();
  document.getElementById("termVal").textContent = term + " months";
  document.getElementById("f-amount").style.setProperty("--fill",
    ((amount - 50000) / (1000000 - 50000) * 100) + "%");
  document.getElementById("f-term").style.setProperty("--fill",
    (+document.getElementById("f-term").value / 3 * 100) + "%");
  document.getElementById("monthlyPill").textContent =
    "≈ ¥" + Math.round(monthlyPayment(amount, term)).toLocaleString() + " / month";
}

// ---- Random applicant profiles ----
const RANDOM_POOL = [
  { name: "Emily Chen",  credit: 810, income: 32000, amount: 500000, debt: 4000, job: 8, overdue: 0, house: 1 },
  { name: "Marcus Lee",  credit: 590, income: 12000, amount: 400000, debt: 5000, job: 1, overdue: 6, house: 0 },
  { name: "Sofia Wong",  credit: 705, income: 15000, amount: 200000, debt: 2500, job: 3, overdue: 1, house: 0 },
  { name: "James Park",  credit: 660, income: 22000, amount: 600000, debt: 8000, job: 5, overdue: 2, house: 1 },
  { name: "Ava Liu",     credit: 780, income: 26000, amount: 350000, debt: 3000, job: 8, overdue: 0, house: 1 },
  { name: "Noah Kim",    credit: 540, income: 9000,  amount: 250000, debt: 3000, job: 0, overdue: 3, house: 0 },
  { name: "Mia Tan",     credit: 730, income: 11000, amount: 180000, debt: 1000, job: 3, overdue: 0, house: 0 },
];
function fillRandom() {
  const p = RANDOM_POOL[Math.floor(Math.random() * RANDOM_POOL.length)];
  document.getElementById("f-name").value = p.name;
  document.getElementById("f-income").value = p.income;
  document.getElementById("f-amount").value = p.amount;
  document.getElementById("f-credit").value = p.credit;
  document.getElementById("f-debt").value = p.debt;
  document.getElementById("f-job").value = String(p.job);
  document.getElementById("f-overdue").value = p.overdue;
  document.getElementById("f-house").value = String(p.house);
  syncSliders();
  runDecision();
}

const THINK_STEPS = [
  "Reading through your application…",
  "Understanding your situation…",
  "Weighing what matters most…",
  "Putting it into plain words…",
];

function runDecision() {
  const amount = +document.getElementById("f-amount").value;
  const term = TERMS[+document.getElementById("f-term").value];
  const a = {
    name: document.getElementById("f-name").value || "Applicant",
    monthlyIncome: +document.getElementById("f-income").value || 0,
    amount, term,
    creditScore: +document.getElementById("f-credit").value || 0,
    monthlyDebt: +document.getElementById("f-debt").value || 0,
    jobYears: +document.getElementById("f-job").value,
    overdue: +document.getElementById("f-overdue").value || 0,
    hasHouse: document.getElementById("f-house").value === "1",
  };
  a.estimateMonthly = monthlyPayment(amount, term);

  document.getElementById("page-form").classList.add("hidden");
  document.getElementById("page-result").classList.add("hidden");
  const think = document.getElementById("page-thinking");
  think.classList.add("page-anim");
  think.classList.remove("hidden");
  const msg = document.getElementById("thinking-msg");
  let step = 0;
  msg.textContent = THINK_STEPS[0];
  const timer = setInterval(() => {
    step++;
    if (step < THINK_STEPS.length) msg.textContent = THINK_STEPS[step];
  }, 340);

  setTimeout(() => {
    clearInterval(timer);
    think.classList.add("hidden");

    const results = RULES.map(rule => ({ rule, ...rule.evaluate(a) }));
    const score = results.reduce((s, x) => s + x.impact, 0);
    const hard = results.filter(x => x.hard);
    const decision = hard.length ? "reject" : score >= PASS ? "approve" : score >= REVIEW ? "review" : "reject";

    render(a, results, score, decision, hard);
    const res = document.getElementById("page-result");
    res.classList.add("page-anim");
    res.classList.remove("hidden");
    window.scrollTo(0, 0);
    if (decision === "approve") confetti();
  }, THINK_STEPS.length * 340 + 400);
}

function render(a, results, score, decision, hard) {
  // ===== Verdict hero — warm, human, no numbers for the applicant =====
  const hero = document.getElementById("verdictHero");
  hero.className = "verdict-hero " + decision;
  const emoji = { approve: "🎉", review: "🤝", reject: "💛" }[decision];
  const title = {
    approve: "Good news — we're happy to say yes",
    review: "We'd like a person to take a closer look",
    reject: "We're unable to say yes this time",
  }[decision];
  const desc = {
    approve: `Congratulations, ${a.name}. We've reviewed your application for a ¥${a.amount.toLocaleString()} loan over ${a.term} months, and everything adds up. Below is what made the difference — you earned this.\nA loan officer will be in touch shortly to complete the final steps.`,
    review: `${a.name}, your situation has real strengths alongside some open questions — exactly the kind of case that deserves human judgment rather than a formula. A loan officer will review it personally, usually within 1–2 business days.\nThis is not a no. We simply didn't want a machine to decide it alone.`,
    reject: `${a.name}, we know this isn't the news you were hoping for, and we're sorry to be the ones delivering it.\nPlease know: this decision reflects your circumstances today — not who you are, and not where you'll always be. Below, in plain words, is what made this difficult and what could change it.`,
  }[decision];
  hero.innerHTML = `<div class="emoji">${emoji}</div><h2>${title}</h2><p>${desc}</p>`;

  // ===== Applicant view — narrative cards, no scores, no judgment =====
  const neg = results.filter(x => x.impact < 0);
  const pos = results.filter(x => x.impact > 0);
  let userHtml;
  if (decision === "approve") {
    userHtml = `<div class="section">What made the difference</div>` +
      pos.map((x, i) => card(x, i)).join("");
  } else {
    const shows = neg.length ? neg : [results[0]];
    userHtml = `<div class="section">What made this difficult</div>` +
      shows.map((x, i) => card(x, i)).join("");
  }

  if (decision !== "approve") {
    const tips = [];
    if (a.creditScore < 680) tips.push("Give your credit history a little time to settle — steady, on-time payments are the single most powerful thing you can do");
    const dti = (a.monthlyDebt + a.estimateMonthly) / a.monthlyIncome;
    if (dti > 0.5) tips.push("A smaller amount, a longer term, or settling some existing commitments first would give this loan real room to fit your life");
    if (a.overdue > 0) tips.push("A clean year ahead of you changes this picture dramatically — these things fade faster than people expect");
    if (a.jobYears < 1) tips.push("Once you've settled into your work for a year or so, come back — the door stays open");
    if (tips.length) {
      userHtml += `<div class="section">Where you could go from here</div>
        <ul class="tips" id="tipsList" style="display:none">` +
        tips.map(t => `<li>${t}</li>`).join("") + `</ul>
        <button class="tips-cta" onclick="toggleTips(this)">💬 What could help next time?</button>`;
    }
    userHtml += `<div class="warm-note">💛 A decline today is not a door closed forever. Many of our best customers started exactly here. Whenever you're ready, we'll be glad to look again — with fresh eyes.</div>`;
  }
  document.getElementById("panel-user").innerHTML = userHtml;

  // ===== Management view — the quantified picture lives here =====
  const clamped = Math.max(0, Math.min(100, score));
  const circumference = 2 * Math.PI * 50;
  let bossHtml = `
    <div class="ring-row">
      <div class="ring">
        <svg width="120" height="120" viewBox="0 0 120 120">
          <defs><linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#4f46e5"/><stop offset="100%" stop-color="#a855f7"/>
          </linearGradient></defs>
          <circle class="track" cx="60" cy="60" r="50" fill="none" stroke-width="10"/>
          <circle class="bar" id="ringBar" cx="60" cy="60" r="50" fill="none" stroke-width="10"
            stroke-dasharray="${circumference}" stroke-dashoffset="${circumference}"/>
        </svg>
        <div class="center"><span class="num" id="scoreNum">0</span><span class="lbl">Score</span></div>
      </div>
      <div>
        <span class="risk-tag ${decision === "approve" ? "low" : decision === "review" ? "mid" : "high"}">${decision === "approve" ? "Low risk" : decision === "review" ? "Medium risk" : "High risk"}</span>
        <p style="font-size:13px;color:var(--muted);margin-top:10px">Thresholds: approve ≥ ${PASS} · review ${REVIEW}–${PASS} · decline &lt; ${REVIEW}, or any policy requirement unmet.</p>
      </div>
    </div>
    <div class="section">Factor Breakdown</div><table>
    <thead><tr><th>Factor</th><th>Reading</th><th>Weight</th></tr></thead><tbody>` +
    results.map(x => `
      <tr>
        <td><b>${x.rule.id} ${x.rule.name}</b><br><span style="font-size:12px;color:var(--muted)">${x.short}</span></td>
        <td>${x.status === "good" ? '<span class="pos">Supports</span>' : x.status === "bad" ? '<span class="neg">Strains</span>' : "Neutral"}</td>
        <td class="num ${x.impact >= 0 ? "pos" : "neg"}">${x.impact > 0 ? "+" : ""}${x.impact}</td>
      </tr>`).join("") + `</tbody></table>`;

  if (hard.length) {
    bossHtml += `<div class="section">Policy requirements not met</div>` +
      hard.map(x => `<div class="warm-note" style="background:var(--no-soft)"><b>${x.rule.id} ${x.rule.name}</b> — ${x.detail}</div>`).join("");
  }
  bossHtml += `<div class="meta">Monthly payment estimated at ${APR * 100}% APR, equal installments (≈ ¥${a.estimateMonthly.toFixed(0)}/month).
Every factor and score is auditable and traceable. Applicant-facing copy is intentionally qualitative and non-judgmental — quantification stays in this view.</div>`;
  document.getElementById("panel-boss").innerHTML = bossHtml;

  requestAnimationFrame(() => {
    document.getElementById("ringBar").style.strokeDashoffset =
      circumference * (1 - clamped / 100);
    animateCount(document.getElementById("scoreNum"), score, 1000);
  });

  switchTab("user");
}

function card(x, i) {
  return `<div class="reason-card ${x.status}" style="--i:${i}">
    <div class="icon">${x.icon}</div>
    <h4>${x.short}</h4>
    <p>${x.detail}</p>
  </div>`;
}

function switchTab(t) {
  document.getElementById("tab-user").classList.toggle("active", t === "user");
  document.getElementById("tab-boss").classList.toggle("active", t === "boss");
  document.getElementById("panel-user").classList.toggle("hidden", t !== "user");
  document.getElementById("panel-boss").classList.toggle("hidden", t !== "boss");
}

function resetAll() {
  document.getElementById("page-result").classList.add("hidden");
  document.getElementById("page-thinking").classList.add("hidden");
  const form = document.getElementById("page-form");
  form.classList.add("page-anim");
  form.classList.remove("hidden");
  window.scrollTo(0, 0);
}

// ===== Extras =====
function animateCount(el, target, duration) {
  const start = performance.now();
  function tick(now) {
    const t = Math.min(1, (now - start) / duration);
    const eased = 1 - Math.pow(1 - t, 3);
    el.textContent = Math.round(target * eased);
    if (t < 1) requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

function toggleTips(btn) {
  const list = document.getElementById("tipsList");
  const open = list.style.display !== "none";
  list.style.display = open ? "none" : "";
  btn.textContent = open ? "💬 What could help next time?" : "↑ Hide suggestions";
}

function confetti() {
  const colors = ["#4f46e5", "#a855f7", "#0a9d58", "#f5c518", "#e5484d", "#34c98e"];
  for (let i = 0; i < 70; i++) {
    const c = document.createElement("div");
    c.className = "confetti";
    c.style.left = Math.random() * 100 + "vw";
    c.style.background = colors[i % colors.length];
    c.style.animationDuration = (1.6 + Math.random() * 1.4) + "s";
    c.style.animationDelay = Math.random() * .5 + "s";
    c.style.opacity = .9;
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 3600);
  }
}

syncSliders();
</script>
</body>
</html>
